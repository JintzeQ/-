name: Edge Search Daily
on:
  push:
    branches: [edge-search-daily]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_daily.py | tee edge_search_daily.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-daily-results
          path: |
            daily_output/
            edge_search_daily.log
          retention-days: 7
