name: WOO Live Maker Quick

on:
  push:
    branches: [main]
    paths:
      - 'maker_woo_live_quick.py'
      - '.github/workflows/maker-woo-live-quick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python maker_woo_live_quick.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add maker_woo_live_quick_output/
          git diff --cached --quiet || git commit -m 'Add WOO live maker quick results [skip ci]'
          git push
