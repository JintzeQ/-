name: Edge Search Round 4 Fast
on:
  push:
    branches: [edge-search-r4fast]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run vectorized time-series momentum
        run: python edge_search_round4fast.py | tee edge_search_r4fast.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-round4fast-results
          path: |
            r4f_output/
            edge_search_r4fast.log
          retention-days: 7
