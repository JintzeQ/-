name: FET Maker Quick OOS
on:
  push:
    branches: [main]
    paths: ['maker_fet_quick.py','.github/workflows/maker-fet-quick.yml']
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests tabulate
      - run: python maker_fet_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-fet-quick
          path: maker_fet_quick_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add maker_fet_quick_output/
          git diff --cached --quiet || git commit -m 'Add FET maker quick results [skip ci]'
          git push
