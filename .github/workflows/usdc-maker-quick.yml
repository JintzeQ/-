name: USDC Maker Quick Probe
# git-ref trigger 2026-08-18T04:12Z

on:
  push:
    branches: [main]
    paths:
      - 'usdc_maker_quick.py'
      - '.github/workflows/usdc-maker-quick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets numpy pandas tabulate
      - run: python usdc_maker_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-maker-quick
          path: usdc_maker_quick_output/
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add usdc_maker_quick_output/
          git diff --cached --quiet || git commit -m 'Add USDC maker quick results [skip ci]'
          git push
