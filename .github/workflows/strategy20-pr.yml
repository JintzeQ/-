name: Strategy 20 Lifecycle Reentry Backtest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests tabulate
      - name: Run Strategy 20 frozen backtest
        shell: bash
        run: |
          set -o pipefail
          python persistent_multivenue_throughput_runner.py | tee persistent_multivenue_throughput.log
      - name: Upload Strategy 20 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy20-results
          path: |
            persistent_multivenue_throughput_output/
            persistent_multivenue_throughput.log
          if-no-files-found: warn
          retention-days: 7
