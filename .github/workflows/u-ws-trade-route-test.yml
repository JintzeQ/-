name: BTCU Raw Trade WebSocket Route Test
on:
  push:
    branches: [main]
    paths:
      - 'u_ws_trade_route_test.py'
      - '.github/workflows/u-ws-trade-route-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets
      - run: python u_ws_trade_route_test.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add u_ws_trade_route_output/
          git diff --cached --quiet || git commit -m 'Add BTCU raw trade route results [skip ci]'
          git push
