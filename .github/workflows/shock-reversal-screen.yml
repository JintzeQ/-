name: Shock Reversal Historical Screen

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check screen script
        id: check
        shell: bash
        run: |
          if [ -f shock_reversal_screen.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No shock_reversal_screen.py in this PR; skipping."
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Restore Binance 1m cache
        if: steps.check.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: shock_reversal_cache
          key: ${{ runner.os }}-shock-reversal-1m-v1
      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install pandas numpy requests
      - name: Normalize timestamp resolution
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('shock_reversal_screen.py')
          s=p.read_text()
          old='ts_ns = x.timestamp.astype("int64").to_numpy(dtype=np.int64)'
          new='ts_ns = x.timestamp.to_numpy(dtype="datetime64[ns]").astype(np.int64)'
          if old in s:
              p.write_text(s.replace(old,new))
              print('patched timestamp int resolution to ns')
          else:
              print('timestamp normalization already present')
          PY
      - name: Run broad historical shock/reversal screen
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          python shock_reversal_screen.py | tee shock_reversal.log
      - name: Upload results
        if: always() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shock-reversal-screen-results
          path: |
            shock_reversal_output/
            shock_reversal.log
          retention-days: 7
