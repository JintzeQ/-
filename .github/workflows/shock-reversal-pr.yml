name: Shock Reversal Historical Screen
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate
      - name: Run Strategy 2A screen
        shell: bash
        run: |
          set -o pipefail
          python shock_reversal_screen.py | tee shock_reversal.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shock-reversal-results
          path: |
            shock_reversal_output/
            shock_reversal.log
          retention-days: 7
