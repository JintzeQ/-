name: Edge Search Retest
on:
  push:
    branches: [edge-search-retest]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_retest.py | tee edge_search_retest.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-retest-results
          path: |
            retest_output/
            edge_search_retest.log
          retention-days: 7
