name: Fresh GALA 500 Maker OOS Replication 2
on:
  push:
    branches: [main]
    paths:
      - 'maker_gala_500_oos2.py'
      - '.github/workflows/maker-gala-500-oos2.yml'
permissions:
  contents: write
jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python maker_gala_500_oos2.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-gala-500-oos2
          path: maker_gala_500_oos2_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add maker_gala_500_oos2_output/
          git diff --cached --quiet || git commit -m 'Add second GALA $500 maker OOS results [skip ci]'
          git push
