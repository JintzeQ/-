name: Edge Search Round 21
on:
  push:
    branches: [edge-search-r21]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round21.py | tee edge_search_r21.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round21-results
          path: |
            r21_output/
            edge_search_r21.log
          retention-days: 7
