name: USDC Turnover WS V2
on:
  push:
    branches: [main]
    paths:
      - 'usdc_turnover_ws_v2.py'
      - '.github/workflows/usdc-turnover-ws-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python usdc_turnover_ws_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-turnover-ws-v2
          path: usdc_turnover_v2_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add usdc_turnover_v2_output/
          git diff --cached --quiet || git commit -m 'Add USDC turnover WS v2 results [skip ci]'
          git push
