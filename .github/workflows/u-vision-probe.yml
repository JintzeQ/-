name: BTCU ETHU Vision Probe
on:
  push:
    branches: [main]
    paths:
      - 'u_vision_probe.py'
      - '.github/workflows/u-vision-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python u_vision_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add u_vision_probe_output/
          git diff --cached --quiet || git commit -m 'Add U Vision probe results [skip ci]'
          git push
# Re-trigger only; probe parameters unchanged.
