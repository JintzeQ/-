name: Edge Search Round 20
on:
  push:
    branches: [edge-search-r20]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round20.py | tee edge_search_r20.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round20-results
          path: |
            r20_output/
            edge_search_r20.log
          retention-days: 7
