name: BookTicker Archive Check
on:
  push:
    branches: [main]
    paths: ['bookticker_archive_check.py','.github/workflows/bookticker-archive-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python bookticker_archive_check.py > bookticker_archive_check.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add bookticker_archive_check.csv
          git diff --cached --quiet || git commit -m 'Add bookTicker archive check [skip ci]'
          git push
