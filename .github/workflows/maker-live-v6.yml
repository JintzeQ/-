name: Current Market Maker V6

on:
  push:
    branches: [main]
    paths:
      - 'maker_live_v6.py'
      - '.github/workflows/maker-live-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python maker_live_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-live-v6
          path: maker_live_v6_output/
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add maker_live_v6_output/
          git diff --cached --quiet || git commit -m 'Add current maker v6 results [skip ci]'
          git push
