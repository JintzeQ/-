name: Edge Search Round 16
on:
  push:
    branches: [edge-search-r16]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round16.py | tee edge_search_r16.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round16-results
          path: |
            r16_output/
            edge_search_r16.log
          retention-days: 7
