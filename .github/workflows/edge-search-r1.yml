name: Edge Search Round 1
on:
  push:
    branches: [edge-search-r1]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run edge search
        run: python edge_search_round1.py | tee edge_search_r1.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-round1-results
          path: |
            edge_output/
            edge_search_r1.log
          retention-days: 7
