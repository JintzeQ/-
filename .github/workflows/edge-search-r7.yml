name: Edge Search Round 7
on:
  push:
    branches: [edge-search-r7]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round7.py | tee edge_search_r7.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-round7-results
          path: |
            r7_output/
            edge_search_r7.log
          retention-days: 7
