name: Edge Search Round 28
on:
  push:
    branches: [edge-search-r28]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round28.py | tee edge_search_r28.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round28-results
          path: |
            r28_output/
            edge_search_r28.log
          retention-days: 7
