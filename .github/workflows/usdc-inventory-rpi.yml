name: RPI Aware USDC Inventory Maker
on:
  push:
    branches: [main]
    paths:
      - 'usdc_inventory_rpi_probe.py'
      - '.github/workflows/usdc-inventory-rpi.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets requests pandas numpy tabulate
      - run: python usdc_inventory_rpi_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-inventory-rpi
          path: usdc_inventory_rpi_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add usdc_inventory_rpi_output/
          git diff --cached --quiet || git commit -m 'Add RPI-aware USDC inventory maker results [skip ci]'
          git push
