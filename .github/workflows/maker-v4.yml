name: ONEUSDT Maker V4 Backtest

on:
  push:
    branches: [main]
    paths:
      - 'maker_v4_backtest.py'
      - '.github/workflows/maker-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run maker backtest
        run: python maker_v4_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-v4-output
          path: maker_v4_output/
      - name: Commit compact results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maker_v4_output/
          git diff --cached --quiet || git commit -m 'Add ONEUSDT maker v4 results [skip ci]'
          git push
