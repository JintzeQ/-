name: USDC Queue Cancellation Credit
# trigger prospective queue test
on:
  push:
    branches: [main]
    paths:
      - 'usdc_queue_cancel_credit.py'
      - '.github/workflows/usdc-queue-cancel-credit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python usdc_queue_cancel_credit.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-queue-cancel-credit
          path: usdc_queue_cancel_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add usdc_queue_cancel_output/
          git diff --cached --quiet || git commit -m 'Add USDC queue cancellation-credit results [skip ci]'
          git push
