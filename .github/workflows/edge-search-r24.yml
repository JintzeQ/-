name: Edge Search Round 24
on:
  push:
    branches: [edge-search-r24]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round24.py | tee edge_search_r24.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round24-results
          path: |
            r24_output/
            edge_search_r24.log
          retention-days: 7
