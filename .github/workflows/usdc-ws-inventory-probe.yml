name: Robust USDC Inventory Maker Probe
on:
  push:
    branches: [main]
    paths:
      - 'usdc_ws_inventory_probe.py'
      - '.github/workflows/usdc-ws-inventory-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets pandas numpy tabulate
      - run: python usdc_ws_inventory_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdc-ws-inventory-probe
          path: usdc_ws_inventory_output/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add usdc_ws_inventory_output/
          git diff --cached --quiet || git commit -m 'Add robust USDC inventory probe results [skip ci]'
          git push
