name: Validate Daily MA100 Slope10
on:
  push:
    branches: [validate-daily-ma100s10]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python validate_daily_ma100s10.py | tee validate_daily_ma100s10.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-daily-ma100s10-results
          path: |
            vma_output/
            validate_daily_ma100s10.log
          retention-days: 7
