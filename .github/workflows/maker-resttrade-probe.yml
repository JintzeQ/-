name: REST-Trade Maker Probe

on:
  push:
    branches: [main]
    paths:
      - 'maker_resttrade_probe.py'
      - '.github/workflows/maker-resttrade-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets requests numpy pandas
      - run: python maker_resttrade_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-resttrade-probe
          path: maker_resttrade_output/
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maker_resttrade_output/
          git diff --cached --quiet || git commit -m 'Add REST-trade maker probe results [skip ci]'
          git push
