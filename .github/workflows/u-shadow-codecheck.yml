name: U Shadow Recorder Code Check
on:
  push:
    branches: [main]
    paths:
      - 'u_shadow_recorder.py'
      - 'u_shadow_analyzer.py'
      - 'u_shadow_selftest.py'
      - 'U_SHADOW_README.md'
      - '.github/workflows/u-shadow-codecheck.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests websockets pandas numpy tabulate
      - name: Compile
        run: python -m py_compile u_shadow_recorder.py u_shadow_analyzer.py u_shadow_selftest.py
      - name: Analyzer CLI smoke test
        run: python u_shadow_analyzer.py --help
      - name: Synthetic queue-model test
        run: python u_shadow_selftest.py
      - name: Persist PASS marker
        run: |
          printf 'PASS\ncommit=%s\nutc=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > u_shadow_codecheck_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add u_shadow_codecheck_status.txt
          git diff --cached --quiet || git commit -m 'U shadow codecheck PASS [skip ci]'
          git push
