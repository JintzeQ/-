name: Edge Search Round 15
on:
  push:
    branches: [edge-search-r15]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round15.py | tee edge_search_r15.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round15-results
          path: |
            r15_output/
            edge_search_r15.log
          retention-days: 7
