name: BTCU REST Cache Bust Probe
on:
  push:
    branches: [main]
    paths:
      - 'u_rest_cache_probe.py'
      - '.github/workflows/u-rest-cache-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python u_rest_cache_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add u_rest_cache_probe_output/
          git diff --cached --quiet || git commit -m 'Add BTCU REST cache-bust results [skip ci]'
          git push
