name: LeadLag BookTicker PR Backtest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run tick-level lead-lag backtest
        shell: bash
        run: |
          set -o pipefail
          python leadlag_bookticker_backtest_v2.py | tee leadlag_backtest.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadlag-bookticker-results-v2
          path: |
            leadlag_output_v2/
            leadlag_backtest.log
          retention-days: 7
