name: Edge Search Round 4
on:
  push:
    branches: [edge-search-r4]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run time-series momentum search
        run: python edge_search_round4.py | tee edge_search_r4.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-search-round4-results
          path: |
            r4_output/
            edge_search_r4.log
          retention-days: 7
