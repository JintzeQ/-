name: Edge Search Round 17
on:
  push:
    branches: [edge-search-r17]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round17.py | tee edge_search_r17.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round17-results
          path: |
            r17_output/
            edge_search_r17.log
          retention-days: 7
