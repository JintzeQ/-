name: Edge Search Round 22
on:
  push:
    branches: [edge-search-r22]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round22.py | tee edge_search_r22.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round22-results
          path: |
            r22_output/
            edge_search_r22.log
          retention-days: 7
