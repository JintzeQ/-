name: Risk Funding Spread
on:
  push:
    branches: [risk-funding-spread]
  workflow_dispatch:
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python risk_funding_spread.py | tee risk_funding_spread.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-funding-spread-results
          path: |
            rfs_output/
            risk_funding_spread.log
          retention-days: 7
