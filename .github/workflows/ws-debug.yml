name: Futures WS Debug
on:
  push:
    branches: [main]
    paths: ['ws_debug.py','.github/workflows/ws-debug.yml']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install websockets
      - run: python ws_debug.py > ws_debug_result.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ws_debug_result.txt
          git diff --cached --quiet || git commit -m 'Add websocket debug result [skip ci]'
          git push
