name: Edge Search Round 14
on:
  push:
    branches: [edge-search-r14]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - run: python edge_search_round14.py | tee edge_search_r14.log
      - uses: actions/upload-artifact@v4
        with:
          name: edge-search-round14-results
          path: |
            r14_output/
            edge_search_r14.log
          retention-days: 7
